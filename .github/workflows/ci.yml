# Backend CI.
#
# GitHub Actions is free for public repositories and gives private ones a monthly allowance,
# which is why it is used here rather than anything self-hosted.
#
# The build runs `mvn verify`, which compiles main *and* test sources from scratch. That matters:
# an incremental local build once reused a stale test class and reported green while a clean
# build failed, and the Docker image build would have failed on deploy. CI always starts clean,
# so it cannot make that mistake.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Performance tests are heavy, so they run nightly rather than on every commit.
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run on the same branch, so the queue does not back up.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Testcontainers needs a Docker daemon; ubuntu-latest already has one, so nothing to
      # install — this just fails fast with a clear message if that ever changes.
      - name: Check Docker is available
        run: docker info > /dev/null

      - name: Build and test
        run: mvn -B verify

      - name: Publish test report
        # Runs even when tests fail, which is precisely when the report is wanted.
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          detailed_summary: true
          include_passed: false

      - name: Upload the jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: generationb-jar
          path: target/*.jar
          retention-days: 5

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build

    steps:
      - uses: actions/checkout@v4

      # Render builds from this Dockerfile. Building it here means a deploy cannot be the first
      # time anyone finds out it does not build.
      - name: Build the image
        run: docker build -t generationb-api:ci .

      - name: Check it starts and answers its health check
        run: |
          docker network create ci-net
          docker run -d --name ci-db --network ci-net \
            -e POSTGRES_DB=generationb -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            postgres:16-alpine
          # Wait for Postgres rather than sleeping a fixed amount.
          for i in $(seq 1 30); do
            docker exec ci-db pg_isready -U postgres && break
            sleep 2
          done

          docker run -d --name ci-api --network ci-net -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://ci-db:5432/generationb \
            -e SPRING_DATASOURCE_USERNAME=postgres \
            -e SPRING_DATASOURCE_PASSWORD=postgres \
            -e JWT_SECRET=ci-only-secret-at-least-256-bits-long-aaaaaaaaaaaaaaaaaaaaaaaa \
            -e CORS_ALLOWED_ORIGINS=http://localhost:5173 \
            -e FRONTEND_URL=http://localhost:5173 \
            -e STORAGE_PROVIDER=local \
            generationb-api:ci

          for i in $(seq 1 45); do
            if curl -fs http://localhost:8080/api/health/live > /dev/null; then
              echo "API is up and every migration applied"
              exit 0
            fi
            sleep 2
          done

          echo "The API never became healthy:"
          docker logs ci-api
          exit 1

  performance:
    name: Performance guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Nightly and on demand only — too slow for every commit.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run the performance suite
        run: mvn -B test -Pperformance

      - name: Publish the report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          check_name: Performance results
