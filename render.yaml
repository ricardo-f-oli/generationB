# Render blueprint. Create the service from this file, or configure the same
# settings by hand in the Render dashboard.
#
# The database is Neon (free tier) rather than Render Postgres, because Render's
# free Postgres expires after 30 days.
#
# `sync: false` means "Render prompts for this and stores it as a secret" — the
# value is never in this file and never in git.
#
# IMPORTANT: a variable absent from this list is not unset, it falls back to the
# default in application.yml. That is how the creator-data vendor was silently
# running on generated data in production while the key sat in someone's shell.
services:
  - type: web
    name: generationb-api
    runtime: docker
    plan: free
    region: frankfurt          # closest free region to the UK
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/live
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # ------------------------------------------------------- database
      - key: SPRING_DATASOURCE_URL
        sync: false            # jdbc:postgresql://<neon-host>/<db>?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

      # ----------------------------------------------------- app basics
      - key: JWT_SECRET
        generateValue: true    # Render generates a long random value
      - key: CORS_ALLOWED_ORIGINS
        sync: false            # https://<your-app>.vercel.app
      - key: FRONTEND_URL
        sync: false            # https://<your-app>.vercel.app

      # ------------------------------- creator-data vendor (#10, 11, 25, 26)
      #
      # The key is all that is needed. A configured key selects the vendor.
      #
      # INSIGHTS_PROVIDER is NOT set here on purpose. It exists only to override
      # that — `mock` to hold a live key without using it. Leaving it unset means
      # this cannot drift out of step with a key added in the dashboard.
      - key: MODASH_API_KEY
        sync: false

      # ----------------------------------------------------------- email
      - key: OUTREACH_SENDGRID_API_KEY
        sync: false
      - key: OUTREACH_FROM_ADDRESS
        sync: false            # noreply@btheagency.com
      - key: OUTREACH_FROM_NAME
        value: B. The Agency
      - key: OUTREACH_REPLY_DOMAIN
        sync: false            # reply.btheagency.com — needs its own MX record

      # Requirement #30. The event webhook is public by necessity and fails
      # CLOSED: without this key every delivery event is rejected with a 403.
      # From SendGrid > Settings > Mail Settings > Event Webhook, after turning
      # on "Signed Event Webhook Requests".
      - key: SENDGRID_WEBHOOK_PUBLIC_KEY
        sync: false

      # SendGrid does not sign Inbound Parse, so the reply endpoint is guarded
      # by an unguessable path segment instead:
      #   https://<host>/api/webhooks/sendgrid/inbound/<this value>
      # Generate with `openssl rand -hex 32`. Empty means replies are refused.
      - key: OUTREACH_SENDGRID_INBOUND_TOKEN
        generateValue: true

      # Where a creator's reply goes when the campaign owner has no email on
      # file. The reply is stored either way; without this the notification is
      # what gets lost.
      - key: OUTREACH_REPLY_FALLBACK_ADDRESS
        sync: false

      - key: RESEND_API_KEY
        sync: false

      # --------------------------------------------------------- storage
      #
      # The prod profile already defaults storage.provider to s3, but the
      # credentials have to come from somewhere. Without them card attachments
      # fail at upload — an ephemeral container disk is not storage.
      - key: STORAGE_PROVIDER
        value: s3
      - key: STORAGE_ENDPOINT
        sync: false            # https://<account>.r2.cloudflarestorage.com
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto

      # ------------------------------------------------------------- LLM
      - key: GROQ_API_KEY
        sync: false

      # ------------------------------------------- gifting insurance (#40)
      #
      # Left at its default of true on purpose. Dispatch is refused for a brand
      # with no in-date product liability cover on file. Set to false only for
      # a demo, and take it off afterwards.
      # - key: GIFTING_REQUIRE_PRODUCT_LIABILITY
      #   value: "false"
