# Render blueprint. Create the service from this file, or configure the same
# settings by hand in the Render dashboard.
#
# The database is Supabase (free tier). Render's own free Postgres expires after 30 days; Neon
# was used before that and its free monthly compute allowance was exhausted, which took the API
# down at startup (Flyway could not connect: "exceeded the quota"). See the minimum-idle note in
# application.yml — a permanently-held connection was the reason it burned compute around the
# clock, and that mistake is portable to any serverless Postgres, Supabase included.
#
# IMPORTANT: use the SESSION POOLER host, not the direct one.
#   direct   db.<ref>.supabase.co:5432                  IPv6 only -> unreachable from Render
#   pooler   aws-1-<region>.pooler.supabase.com:5432    IPv4, username is postgres.<ref>
# Port 5432 on the pooler is session mode. Do NOT use 6543 (transaction mode): it does not carry
# prepared statements, which Hibernate needs, and Flyway's migration lock needs a real session.
#
# `sync: false` means "Render prompts for this and stores it as a secret" — the
# value is never in this file and never in git.
#
# IMPORTANT: a variable absent from this list is not unset, it falls back to the
# default in application.yml. That is how production once ran silently on
# generated creator data while the credential sat in someone's shell.
services:
  - type: web
    name: generationb-api
    runtime: docker
    plan: free
    region: frankfurt          # closest free region to the UK
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/live
    branch: main             # prod tracks main only — staging pushes must not land here
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # ------------------------------------------------------- database
      - key: SPRING_DATASOURCE_URL
        sync: false            # jdbc:postgresql://aws-1-<region>.pooler.supabase.com:5432/postgres?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

      # ----------------------------------------------------- app basics
      - key: JWT_SECRET
        generateValue: true    # Render generates a long random value
      - key: CORS_ALLOWED_ORIGINS
        sync: false            # https://<your-app>.vercel.app
      - key: FRONTEND_URL
        sync: false            # https://<your-app>.vercel.app

      # ---------------------- creator data, free platform APIs (#10, 11, 26)
      #
      # No paid vendor. Setting either credential selects the platform APIs;
      # with neither, the app runs on generated sample data (logged as
      # [MOCK INSIGHTS]). See docs/integrations/platform-apis.md.
      #
      # Instagram: a long-lived Page token for the agency's Facebook Page and
      # the id of the Instagram Business account linked to it. Business
      # Discovery and Hashtag Search are made as that account.
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_IG_USER_ID
        sync: false
      # YouTube: a plain Data API v3 key from Google Cloud.
      - key: YOUTUBE_API_KEY
        sync: false
      # Encrypts creators' OAuth tokens once they connect accounts.
      # `openssl rand -base64 32`. Losing it means creators reconnect.
      - key: INSIGHTS_TOKEN_ENCRYPTION_KEY
        sync: false

      # ----------------------------------------------------------- email
      - key: OUTREACH_SENDGRID_API_KEY
        sync: false
      - key: OUTREACH_FROM_ADDRESS
        sync: false            # noreply@btheagency.com
      - key: OUTREACH_FROM_NAME
        value: B. The Agency
      - key: OUTREACH_REPLY_DOMAIN
        sync: false            # reply.btheagency.com — needs its own MX record

      # Requirement #30. The event webhook is public by necessity and fails
      # CLOSED: without this key every delivery event is rejected with a 403.
      # From SendGrid > Settings > Mail Settings > Event Webhook, after turning
      # on "Signed Event Webhook Requests".
      - key: SENDGRID_WEBHOOK_PUBLIC_KEY
        sync: false

      # SendGrid does not sign Inbound Parse, so the reply endpoint is guarded
      # by an unguessable path segment instead:
      #   https://<host>/api/webhooks/sendgrid/inbound/<this value>
      # Generate with `openssl rand -hex 32`. Empty means replies are refused.
      - key: OUTREACH_SENDGRID_INBOUND_TOKEN
        generateValue: true

      # Where a creator's reply goes when the campaign owner has no email on
      # file. The reply is stored either way; without this the notification is
      # what gets lost.
      - key: OUTREACH_REPLY_FALLBACK_ADDRESS
        sync: false

      - key: RESEND_API_KEY
        sync: false

      # --------------------------------------------------------- storage
      #
      # The prod profile already defaults storage.provider to s3, but the
      # credentials have to come from somewhere. Without them card attachments
      # fail at upload — an ephemeral container disk is not storage.
      - key: STORAGE_PROVIDER
        value: s3
      - key: STORAGE_ENDPOINT
        sync: false            # https://<account>.r2.cloudflarestorage.com
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto

      # ------------------------------------------------------------- LLM
      - key: GROQ_API_KEY
        sync: false

      # ------------------------------------------- gifting insurance (#40)
      #
      # Left at its default of true on purpose. Dispatch is refused for a brand
      # with no in-date product liability cover on file. Set to false only for
      # a demo, and take it off afterwards.
      # - key: GIFTING_REQUIRE_PRODUCT_LIABILITY
      #   value: "false"

# ---------------------------------------------------------------------------
# Staging: the same image, built from the same Dockerfile, on the `staging`
# branch and its own Supabase project.
#
# Every `sync: false` below is prompted for separately from the production
# service's. That is the point — nothing is shared. Reusing the production
# database URL here would make "just testing on staging" a production write,
# and reusing the production JWT secret would make a staging token valid in
# production.
#
# Free-plan caveat worth knowing before the first demo: a free Render service
# sleeps after ~15 minutes idle and takes 30-60s to wake. The first request
# after a quiet morning will look like an outage and is not one.
  - type: web
    name: generationb-api-staging
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/live
    branch: staging
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: staging

      # --------------------------------------------------- database (separate)
      # A SEPARATE Supabase project from production. Supabase has no branching
      # on the free tier, so this is a second project rather than a branch —
      # which is stricter isolation, and resetting it means resetting that
      # project rather than dropping a branch.
      - key: SPRING_DATASOURCE_URL
        sync: false            # the STAGING project's session-pooler URL, not production's
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

      # ----------------------------------------------------------- app basics
      # Generated independently. A token minted by staging must be worthless
      # against production.
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false            # https://<staging-app>.vercel.app
      - key: FRONTEND_URL
        sync: false            # https://<staging-app>.vercel.app

      # ------------------------------------------------- creator data (mock)
      #
      # Deliberately left unset. With neither credential the app runs on
      # generated sample data and logs every call as [MOCK INSIGHTS], which is
      # what you want on staging: Meta's hashtag budget (30 unique tags per
      # rolling 7 days) is per APP, shared with production. A staging run that
      # burns it is a production outage in mention discovery.
      #
      # To test the real integration, set these TEMPORARILY and unset them after.
      # - key: META_ACCESS_TOKEN
      #   sync: false
      # - key: META_IG_USER_ID
      #   sync: false
      # - key: YOUTUBE_API_KEY
      #   sync: false

      # Must be its own key. Tokens encrypted with the production key cannot be
      # read with this one, which is the isolation working as intended.
      - key: INSIGHTS_TOKEN_ENCRYPTION_KEY
        sync: false            # openssl rand -base64 32

      # ----------------------------------------------------------- email
      #
      # The single most expensive staging mistake available: a test campaign
      # emailing real creators from the real domain. Use a SendGrid sandbox or
      # a separate sub-user, and a from-address nobody mistakes for the agency.
      - key: OUTREACH_SENDGRID_API_KEY
        sync: false
      - key: OUTREACH_FROM_ADDRESS
        sync: false            # staging@... - NOT noreply@btheagency.com
      - key: OUTREACH_FROM_NAME
        value: B. The Agency (staging)
      - key: OUTREACH_REPLY_DOMAIN
        sync: false
      - key: SENDGRID_WEBHOOK_PUBLIC_KEY
        sync: false            # from the staging webhook's own signing key
      - key: OUTREACH_SENDGRID_INBOUND_TOKEN
        generateValue: true
      - key: OUTREACH_REPLY_FALLBACK_ADDRESS
        sync: false
      - key: RESEND_API_KEY
        sync: false

      # --------------------------------------------------------- storage
      # A separate bucket. Staging uploads in the production bucket are litter
      # nothing will ever clean up.
      - key: STORAGE_PROVIDER
        value: s3
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false            # generationb-staging
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_REGION
        value: auto

      # ------------------------------------------------------------- LLM
      # Groq's free tier is rate-limited per key. Sharing production's key means
      # a staging brief generation can 429 a real one.
      - key: GROQ_API_KEY
        sync: false

      # Staging demo brands have no insurance policy on file, so dispatch would
      # be refused and look like a bug rather than the control it is (#40).
      - key: GIFTING_REQUIRE_PRODUCT_LIABILITY
        value: "false"
