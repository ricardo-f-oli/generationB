spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/generationb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

# Local only. Outside the local profile JwtUtil refuses to start without JWT_SECRET (Q-B5).
jwt:
  secret: ${JWT_SECRET:SuperSecretKeyForSigningJWTsThatIsAtLeast256BitsLongAndVerySecure}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cookie-secure: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    com.generationb: DEBUG
