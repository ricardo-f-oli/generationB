spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/generationb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

# Local only. Outside the local profile JwtUtil refuses to start without JWT_SECRET (Q-B5).
jwt:
  secret: ${JWT_SECRET:SuperSecretKeyForSigningJWTsThatIsAtLeast256BitsLongAndVerySecure}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cookie-secure: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    com.generationb: DEBUG

# Local development convenience. The SendGrid event webhook fails closed without a public key,
# which is correct everywhere else but makes it impossible to poke the endpoint with curl here.
# Every call it lets through is logged as a warning. Never set this outside local.
outreach:
  sendgrid:
    webhook-allow-unsigned: ${SENDGRID_WEBHOOK_ALLOW_UNSIGNED:true}
    inbound-token: ${OUTREACH_SENDGRID_INBOUND_TOKEN:local-dev-inbound-token}

# Seeded demo brands have no insurance policy on file, and blocking dispatch on a fresh clone
# would look like a bug rather than a control. Production keeps the default of true.
gifting:
  require-product-liability: ${GIFTING_REQUIRE_PRODUCT_LIABILITY:false}
