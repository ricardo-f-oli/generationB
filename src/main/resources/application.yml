spring:
  application:
    name: generationb
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/generationb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Q-G7: Render free tier is a single small instance and Neon free tier caps
      # connections, so the pool is deliberately small.
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Q-G7: batch writes instead of one round trip per row.
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
        query:
          fail_on_pagination_over_collection_fetch: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/plain
  error:
    include-message: never
    include-stacktrace: never

# Q-J17: one canonical timezone for the whole platform.
app:
  timezone: Europe/London
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cookie-secure: ${COOKIE_SECURE:false}

jwt:
  access-token-minutes: ${JWT_ACCESS_MINUTES:30}

# Q-B18/Q-B19: Groq is the LLM provider (free tier, OpenAI-compatible API).
# Without a key the services fall back to a deterministic local draft rather than failing.
#
# The model id is verified against this account's /v1/models — llama-3.3-70b-versatile was
# configured here previously and does not exist on it, which is the same failure mode as the
# old hard-coded claude-sonnet-4-6. If Groq retires this id, GET /v1/models lists the current
# ones and AI_MODEL overrides it without a redeploy.
ai:
  provider: groq
  base-url: ${AI_BASE_URL:https://api.groq.com/openai/v1}
  api-key: ${GROQ_API_KEY:}
  model: ${AI_MODEL:openai/gpt-oss-120b}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:20}
  max-tokens: ${AI_MAX_TOKENS:1200}

# The creator-data vendor. This is what unblocks requirements #10, #11, #25 and #26 — the
# auto-clipping pipeline, hashtag and competitor mention discovery, and audience demographics.
#
# ONE variable is enough: set MODASH_API_KEY and the vendor is used.
#
# INSIGHTS_PROVIDER only exists to override that. Leave it unset in normal operation; set it to
# `mock` to hold a live key without using it yet, or to `modash` to be explicit. It used to be
# required alongside the key, and forgetting it left production quietly running on generated
# data with nothing on screen looking wrong — a bad trade for a switch used about once.
#
# Costs, from the vendor's own docs and confirmed against this account:
#   /raw/*                         1 raw request   — post feeds, used by auto-clipping
#   /{platform}/users              free            — handle lookup
#   /{platform}/profile/*/report   1 credit        — audience demographics
#   /ai/{platform}/text-search     0.025/profile   — natural-language search
# A trial account carries 100 of each, so a careless loop is a real risk. ModashClient refuses
# any metered call that would take the balance below the reserve.
insights:
  # Empty means "decide from whether a key is present" — see InsightsProviderCondition.
  provider: ${INSIGHTS_PROVIDER:}
  modash:
    api-key: ${MODASH_API_KEY:}
    base-url: ${MODASH_BASE_URL:https://api.modash.io/v1}
    timeout-seconds: ${MODASH_TIMEOUT_SECONDS:25}
    # The documented limit is 2 requests/second on both allowances.
    min-request-interval-ms: ${MODASH_MIN_INTERVAL_MS:550}
    max-retries: ${MODASH_MAX_RETRIES:2}
    # Never spend the account to zero: a report someone is waiting on in a meeting should still
    # run after a bulk job has been careless.
    credit-reserve: ${MODASH_CREDIT_RESERVE:2}
    raw-reserve: ${MODASH_RAW_RESERVE:2}
    budget-ttl-seconds: ${MODASH_BUDGET_TTL_SECONDS:120}
  # ------------------------------------------- straight from the platforms
  #
  # The no-vendor route. Meta, Google and TikTok each answer part of what a paid creator-data
  # vendor does, for nothing, and the provider routes each question to whichever can answer it.
  #
  # Setting either credential below selects this automatically — see InsightsProviderCondition.
  #
  # What you get, and what you do not:
  #   Instagram  posts + follower counts for ANY public professional account (Business Discovery)
  #              hashtag search, capped at 30 unique tags per rolling 7 days PER APP
  #              audience demographics ONLY for creators who connect their account
  #   YouTube    everything public, free; demographics only for connected channels
  #   TikTok     content only, and only for connected creators. NO demographics at any tier
  #              available to a commercial agency — this is a platform limit, not a config gap.
  #   Search     none. No platform exposes a creator index, so discovery by description is gone.
  meta:
    base-url: ${META_BASE_URL:https://graph.facebook.com}
    # Pinned. Meta deprecates a version roughly every two years and changes field shapes between
    # them; finding that out from a production error is worse than from a calendar reminder.
    api-version: ${META_API_VERSION:v21.0}
    # A long-lived Page token for the agency's own Facebook Page, linked to the IG Business
    # account below. Every lookup is made as that account.
    access-token: ${META_ACCESS_TOKEN:}
    ig-user-id: ${META_IG_USER_ID:}
    timeout-seconds: ${META_TIMEOUT_SECONDS:20}
    min-request-interval-ms: ${META_MIN_INTERVAL_MS:120}
    # Meta's own figure. Shared across every brand, so it is the binding constraint on mention
    # discovery rather than a formality.
    hashtag-limit: ${META_HASHTAG_LIMIT:30}
    hashtag-reserve: ${META_HASHTAG_RESERVE:2}

  youtube:
    base-url: ${YOUTUBE_BASE_URL:https://www.googleapis.com/youtube/v3}
    # A plain API key. No OAuth, no app review, no per-creator permission.
    api-key: ${YOUTUBE_API_KEY:}
    timeout-seconds: ${YOUTUBE_TIMEOUT_SECONDS:20}
    # Google's default. Costs are uneven: a channel or playlist read is 1 unit, a search is 100.
    daily-quota-units: ${YOUTUBE_DAILY_QUOTA:10000}

  # Creators' OAuth tokens are live credentials for someone else's account, so they are encrypted
  # at rest rather than hashed — they have to be usable. AES-256-GCM.
  #   openssl rand -base64 32
  # Without this, account connections are refused and demographics stay unavailable.
  token-encryption-key: ${INSIGHTS_TOKEN_ENCRYPTION_KEY:}

  enrichment:
    # Audience demographics move over months. Re-buying a report inside this window is waste.
    ttl-days: ${INSIGHTS_TTL_DAYS:30}
    # The hard ceiling on one bulk refresh, whatever limit the caller asks for.
    max-batch: ${INSIGHTS_MAX_BATCH:25}

# Requirement #5 and the asset exports. Cloudflare R2 is S3-compatible with a free tier and
# no egress fees, which matters because this stores campaign video.
#
# Unset means "local", so a fresh clone can upload a file without an R2 account. The prod
# profile overrides it — an ephemeral container disk is not storage.
storage:
  provider: ${STORAGE_PROVIDER:local}
  local-path: ${STORAGE_LOCAL_PATH:./data/uploads}
  endpoint: ${STORAGE_ENDPOINT:}
  bucket: ${STORAGE_BUCKET:generationb}
  access-key: ${STORAGE_ACCESS_KEY:}
  secret-key: ${STORAGE_SECRET_KEY:}
  region: ${STORAGE_REGION:auto}

# Multipart limits mirror StorageKeys.MAX_BYTES. Spring rejects an oversized upload before it
# reaches the controller, so a 2GB POST cannot exhaust the free tier's 512MB of memory.
spring.servlet.multipart:
  max-file-size: 25MB
  max-request-size: 30MB

outreach:
  sendgrid:
    api-key: ${OUTREACH_SENDGRID_API_KEY:}
    from-address: ${OUTREACH_FROM_ADDRESS:noreply@btheagency.com}
    from-name: ${OUTREACH_FROM_NAME:B. The Agency}
    reply-domain: ${OUTREACH_REPLY_DOMAIN:reply.btheagency.com}

    # Requirement #30. The event webhook is permitAll — SendGrid cannot log in — so the
    # signature is the only thing between a stranger and the ability to mark a creator as
    # having replied, or file a spam report that suppresses them across every brand.
    #
    # Copy this from SendGrid > Settings > Mail Settings > Event Webhook, after switching on
    # "Signed Event Webhook Requests". Without it every call is REJECTED, deliberately: the
    # previous behaviour accepted anything and looked like it was working.
    webhook-public-key: ${SENDGRID_WEBHOOK_PUBLIC_KEY:}
    # How far out of step with SendGrid's clock a request may be, in seconds. Survives a retry
    # and some drift; short enough that a captured request is not replayable tomorrow.
    webhook-tolerance-seconds: ${SENDGRID_WEBHOOK_TOLERANCE_SECONDS:600}
    # Local development only. Logs a warning on every call it lets through.
    webhook-allow-unsigned: ${SENDGRID_WEBHOOK_ALLOW_UNSIGNED:false}

    # Inbound Parse is not signed by SendGrid — they offer no signature on it — so the
    # endpoint is protected by an unguessable path segment instead:
    #   https://<host>/api/webhooks/sendgrid/inbound/<this value>
    # Generate with `openssl rand -hex 32`. Empty means the endpoint stays closed.
    inbound-token: ${OUTREACH_SENDGRID_INBOUND_TOKEN:}

    # Where a creator's reply goes if the campaign's owner has no email on file. Replies are
    # stored either way; without this the notification is what is lost.
    reply-fallback-address: ${OUTREACH_REPLY_FALLBACK_ADDRESS:}
  follow-up:
    default-window-days: ${FOLLOW_UP_WINDOW_DAYS:7}

# Requirement #40. Product liability cover belongs to the brand whose product is being posted to
# a stranger's home, so it is recorded per brand and dispatch is refused without it. Turning this
# off makes the recorded policy decorative, which is the state the requirement was in before.
gifting:
  require-product-liability: ${GIFTING_REQUIRE_PRODUCT_LIABILITY:true}

# Requirement #37: GDPR storage limitation. Each module declares its own policy in a
# RetentionSweeper; these are the windows those policies read. The nightly pass runs at 03:00
# Europe/London and writes an evidence row per dataset to retention_runs.
#
# Changing a window here changes what the GDPR screen says, because the screen renders the
# policy text the sweepers generate rather than a separate copy that would drift.
retention:
  # Off switch that leaves previews working — useful on a restored copy of production, where
  # a real sweep would delete data that still exists in the live system.
  enabled: ${RETENTION_ENABLED:true}
  gifting-address:
    # Home addresses. Purpose is spent once the parcel arrives or comes back.
    delivered-days: ${RETENTION_ADDRESS_DELIVERED_DAYS:90}
    unused-days: ${RETENTION_ADDRESS_UNUSED_DAYS:180}
  waitlist:
    # Double opt-in never completed means no consent, so there is no basis to keep the address.
    unconfirmed-days: ${RETENTION_WAITLIST_DAYS:30}
  email-threads:
    months: ${RETENTION_EMAIL_MONTHS:24}
  audit-log:
    months: ${RETENTION_AUDIT_MONTHS:24}
  login-attempts:
    days: ${RETENTION_LOGIN_ATTEMPT_DAYS:90}
  expired-tokens:
    days: ${RETENTION_EXPIRED_TOKEN_DAYS:7}
  creator-review:
    # Flagged for a human decision, never deleted automatically. Three years rather than the
    # usual two: agency relationships are seasonal, and a creator used one Christmas is
    # plausibly used the next but one.
    months: ${RETENTION_CREATOR_REVIEW_MONTHS:36}
    max-listed: ${RETENTION_CREATOR_REVIEW_MAX:100}
  run-log:
    # The evidence has to outlive every dataset it reports on.
    years: ${RETENTION_RUN_LOG_YEARS:6}

resend:
  api-key: ${RESEND_API_KEY:}

logging:
  level:
    root: INFO
    com.generationb: ${LOG_LEVEL:INFO}
  pattern:
    # Q-E32: correlation ids on every line.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] [%X{brandId:-}] %logger{36} - %msg%n"
