spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

# No default: the app refuses to start if this is missing (Q-B5).
jwt:
  secret: ${JWT_SECRET}

app:
  frontend-url: ${FRONTEND_URL}
  cookie-secure: true

# No default either — prod must declare its allowed origins (Q-B14).
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: INFO
    com.generationb: INFO
